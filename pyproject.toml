[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "inflect-models-db"
version = "0.1.0"
description = "Curated database of published dynamical models extracted to Antimony, validated against published results by running through viva-tellurium (INFLECT / ARPA-H CIRCLE)."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.12"
dependencies = [
    # Pinned @<sha> (not branch=main) so a consumer that also pins viva-tellurium
    # (e.g. inflect-sim-core) resolves to the SAME url — a branch source here
    # collides with their @sha pin ("conflicting URLs for viva-tellurium").
    # process-bigraph comes transitively via viva-tellurium (keep it unpinned here
    # so it never conflicts with a consumer's process-bigraph source).
    "viva-tellurium @ git+https://github.com/vivarium-collective/viva-tellurium@2d07d068bb4dd713c9ed61f59747d21b49498cc2",
    "numpy",
    "pyyaml",
    "matplotlib",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
include = ["inflect_models_db*"]

# Ship the curated models (model.ant + card.yaml + reference/ + figures/ + paper/)
# INSIDE the wheel, so `pip install` exposes the database — not only an editable
# source checkout. The files live under inflect_models_db/models/ (see registry.py);
# include_package_data pulls them in via MANIFEST.in's recursive-include.
[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
inflect_models_db = [
    "models/**/*.ant",
    "models/**/*.yaml",
    "models/**/*.csv",
    "models/**/*.xml",
    "models/**/*.png",
    "models/**/*.md",
]

[project.scripts]
inflect-models = "inflect_models_db.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
