name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python, venv, and deps (pulls viva-tellurium from git)
        run: |
          uv python install 3.12
          uv venv --python 3.12
          uv pip install -e ".[dev]"

      - name: Make libpython discoverable (libroadrunner links it at import)
        run: |
          LIBDIR="$(.venv/bin/python -c 'import sysconfig; print(sysconfig.get_config_var("LIBDIR"))')"
          echo "LD_LIBRARY_PATH=${LIBDIR}${LD_LIBRARY_PATH:+:${LD_LIBRARY_PATH}}" >> "$GITHUB_ENV"
          ls -l "$LIBDIR"/libpython*.so* || true

      - name: Run tests
        run: .venv/bin/pytest -q

      - name: Validation + fidelity gate (every model extracted, validated, and graded)
        run: .venv/bin/python scripts/check_models.py

      - name: Fidelity grade (structural reconciliation vs extraction.yaml)
        run: .venv/bin/python -m inflect_models_db.cli grade

      - name: Reproduce figures (sanity check the renderer)
        run: .venv/bin/python -m inflect_models_db.cli reproduce
